name: Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK, CMake and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;26.1.10909125'
      - name: Build SDL/ImGui APK
        working-directory: Android
        run: ./gradlew --no-daemon assembleDebug -PchessAbis=${{ matrix.abi }}
      - name: Collect APK
        run: |
          mkdir -p out/apk
          cp Android/app/build/outputs/apk/debug/app-debug.apk out/apk/Chess-${{ matrix.abi }}.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Chess-Android-${{ matrix.abi }}
          path: out/apk/*.apk
          if-no-files-found: error
          retention-days: 30
  emulator:
    name: Android startup, touch and restoration
    needs: apk
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: Chess-Android-x86_64
          path: out/apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python .github/scripts/smoke-android.py out/apk/Chess-x86_64.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Chess-Android-smoke-test
          path: out/android-smoke/
          if-no-files-found: warn
          retention-days: 30
