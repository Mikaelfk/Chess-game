name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Rules and mobile interface tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - run: cmake -S . -B out/build/mobile-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCHESS_BUILD_MOBILE_PREVIEW=ON
      - run: cmake --build out/build/mobile-tests --parallel 2
      - run: ctest --test-dir out/build/mobile-tests --output-on-failure --no-tests=error

  apk:
    name: Android ${{ matrix.abi }}
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt-arch: android_arm64_v8a
          - abi: x86_64
            qt-arch: android_x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the obsolete SDK "tools" package.
          packages: platform-tools
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Install Qt for Android
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: ${{ matrix.qt-arch }}
          cache: true
      - name: Configure Android application
        env:
          QT_ANDROID_ROOT: ${{ steps.qt.outputs.qt-root-dir }}
        run: >-
          "$QT_ANDROID_ROOT/bin/qt-cmake" -S . -B out/build/android -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DANDROID_SDK_ROOT="$ANDROID_HOME"
          -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          -DQT_HOST_PATH="$QT_HOST_PATH"
      - name: Build installable debug APK
        run: cmake --build out/build/android --target apk --parallel 2
      - name: Collect APK
        run: |
          mkdir -p out/apk
          cp out/build/android/Android/android-build/ChessMobile.apk out/apk/Chess-${{ matrix.abi }}.apk
      - name: Upload Android application
        uses: actions/upload-artifact@v6
        with:
          name: Chess-Android-${{ matrix.abi }}
          path: out/apk/*.apk
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Android emulator startup and game restoration
    needs: apk
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: Chess-Android-x86_64
          path: out/apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test APK on an Android phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python .github/scripts/smoke-android.py out/apk/Chess-x86_64.apk
      - name: Upload Android screenshot and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Chess-Android-smoke-test
          path: out/android-smoke/
          if-no-files-found: warn
          retention-days: 30
