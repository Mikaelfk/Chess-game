name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install coverage and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -r requirements-coverage.txt

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true

      - name: Configure coverage build
        run: cmake -S . -B out/build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCHESS_ENABLE_COVERAGE=ON

      - name: Run tests and enforce coverage goal
        run: cmake --build out/build/coverage --target coverage --parallel 2

      - name: Show coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f out/build/coverage/coverage/summary.md ]; then
            cat out/build/coverage/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload line coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Chess-test-coverage
          path: out/build/coverage/coverage/
          if-no-files-found: warn
          retention-days: 30
